name: Update Medhome Feed

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run parser
        run: |
          # Запускаем скрипт. Он создаст файл medhome_reviews_feed.xml в корне
          python medhome.py

      - name: Prepare and Move
        run: |
          mkdir -p public
          # Перемещаем файл, если он создался
          if [ -f "medhome_reviews_feed.xml" ]; then
            mv medhome_reviews_feed.xml public/
          else
            echo "Ошибка: Скрипт не создал XML-файл!"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/medhome_reviews_feed.xml
          git commit -m "Auto-update feed" || exit 0
          git push
